name: Mutation Testing

# 每周全量跑一次 Stryker（`apps/cli/stryker.config.json` 的 mutate 清单），
# 手动可随时触发。**监控性质**：`thresholds.break` 为 null ⇒ 分数低不会让本次
# 运行变红，报告作为 artifact 留下；它在意的信号是「变异体还杀得死吗」——
# 测试断言变弱时，存活变异体会变多，而覆盖率读数看不出这一点。
#
# 为什么不进 PR 门禁：全量约 30 分钟，按 PR 跑会把每次提交的反馈时间翻倍。
on:
  schedule:
    # 每周日 18:00 UTC（北京时间周一 02:00）
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-testing
  cancel-in-progress: false

jobs:
  mutation:
    name: Stryker (full scope)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Run mutation tests (full scope)
        run: pnpm --filter @miphamai/cli mutate
      - name: Summarise mutation score
        if: always()
        run: |
          REPORT=apps/cli/reports/mutation/mutation.json
          if [ ! -f "$REPORT" ]; then
            echo "### Mutation report missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Stryker did not write \`$REPORT\` — see the run log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const r = require("./apps/cli/reports/mutation/mutation.json");
            const counts = {};
            let total = 0;
            for (const f of Object.values(r.files ?? {})) {
              for (const m of f.mutants ?? []) {
                counts[m.status] = (counts[m.status] ?? 0) + 1;
                total++;
              }
            }
            // Killed / Timeout count as detected; NoCoverage counts as missed:
            // a mutant no test even loads is the worst kind of survivor.
            const killed = (counts.Killed ?? 0) + (counts.Timeout ?? 0);
            const score = total ? ((killed / total) * 100).toFixed(2) : "n/a";
            const order = ["Killed", "Survived", "NoCoverage", "Timeout", "RuntimeError", "CompileError", "Ignored"];
            const rows = order.filter((s) => counts[s]).map((s) => `| ${s} | ${counts[s]} |`);
            console.log("### Mutation score: " + score + "%");
            console.log("");
            console.log("| 状态 | 数量 |");
            console.log("|---|---|");
            console.log(rows.join("\n"));
            console.log("");
            console.log("总分 = (Killed + Timeout) / 全部变异体；NoCoverage 计为未杀死。");
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: apps/cli/reports/mutation/
          retention-days: 30
          if-no-files-found: warn
