name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # 仅 Dependabot PR；pull_request_target 跑在 base 分支上下文，故不 checkout PR 代码（防不可信代码执行）
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge (squash when CI passes)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
