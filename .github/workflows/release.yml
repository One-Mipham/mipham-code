name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── Stage 1: Build binaries (matrix) ──
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            runner: macos-latest
            binary: mipham-darwin-arm64
          - target: bun-darwin-x64
            runner: macos-latest
            binary: mipham-darwin-x64
          - target: bun-linux-x64
            runner: ubuntu-latest
            binary: mipham-linux-x64
          - target: bun-windows-x64
            runner: windows-latest
            binary: mipham-win-x64.exe
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v5

      - run: pnpm install --frozen-lockfile

      - name: Build binary
        working-directory: apps/cli
        run: bun run scripts/generate-bundled-skills.ts && bun build --compile --minify --target=${{ matrix.target }} ./bin/mipham.ts --outfile dist/${{ matrix.binary }}

      - name: Smoke test binary
        working-directory: apps/cli
        shell: bash
        run: ./dist/${{ matrix.binary }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}
          path: apps/cli/dist/${{ matrix.binary }}

  # ── Stage 2: Test ──
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v5

      - run: pnpm install --frozen-lockfile

      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - working-directory: apps/cli
        run: bunx vitest run

  # ── Stage 2.5: macOS DMG ──
  dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - name: Build .app + DMG
        run: |
          cd infrastructure/macos
          ./create-app.sh
          ./create-dmg.sh
          ls -lh mipham-code-*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: mipham-dmg
          path: infrastructure/macos/mipham-code-*.dmg

  # ── Stage 2.6: JetBrains Plugin ──
  jetbrains:
    name: Build JetBrains Plugin
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        working-directory: infrastructure/jetbrains

      - name: Build plugin
        working-directory: infrastructure/jetbrains
        run: ./gradlew buildPlugin --no-daemon --console=plain

      - name: Upload plugin
        uses: actions/upload-artifact@v6
        with:
          name: mipham-jetbrains
          path: infrastructure/jetbrains/build/distributions/mipham-code-jetbrains-*.zip
          if-no-files-found: error

      - name: Publish plugin to JetBrains Marketplace
        if: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN != '' }}
        working-directory: infrastructure/jetbrains
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon --console=plain

  # ── Stage 3: npm Publish ──
  publish:
    name: npm Publish
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v5

      - run: pnpm install --frozen-lockfile

      - name: Smoke test npm package (pack + clean install + resolve imports)
        run: bash scripts/smoke.sh apps/cli

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Publish to npm
        working-directory: apps/cli
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @miphamai/cli version 2>/dev/null || echo "none")
          if [ "$CURRENT" = "$PUBLISHED" ]; then
            echo "Version $CURRENT already published — skipping."
          else
            npm publish --access public
          fi

  # ── Stage 4: GitHub Release ──
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, test, dmg, jetbrains]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Flatten artifact directory
        run: |
          mkdir -p release
          find dist -type f -name 'mipham-*' -exec cp {} release/ \;
          ls -lh release/

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' > /tmp/changelog.txt
          else
            echo "- ${TAG}" > /tmp/changelog.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Mipham Code ${{ github.ref_name }}
          body_path: /tmp/changelog.txt
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
