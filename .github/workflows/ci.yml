name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @miphamai/cli build
      # `--help` 是 commander 的注册表本身：打包期解析不了的入口、漏注册的子命令、
      # 顶层 import 里抛的错，都要等**真正执行**才现形 —— 构建成功不等于产物能跑。
      # `--version` 的判据更硬一档：它必须与 package.json 逐字相符。版本漂移会让
      # 安装脚本装到一个别的东西上，而整条流水线没有第二个步骤会看这个数。
      - name: Compiled binary reports its own usage
        run: |
          set -euo pipefail
          BIN=./apps/cli/dist/mipham
          # 先收进变量再 grep，**不走管道**：`bin --help | grep -q` 里 grep 一命中就退出，
          # 写入端吃到 SIGPIPE，而 `set -o pipefail` 会把这记成整步失败 —— 是否触发取决于
          # 输出有没有撑满管道缓冲，也就是取决于运气。
          HELP="$($BIN --help)"
          echo "$HELP" | grep -qF 'Mipham Code' \
            || { echo "::error::--help 没有输出用法"; exit 1; }
          VERSION="$($BIN --version)"
          echo "binary reports: $VERSION"
          PKG="$(node -p "require('./apps/cli/package.json').version")"
          echo "$VERSION" | grep -qF "$PKG" \
            || { echo "::error::--version ($VERSION) 与 package.json ($PKG) 不一致"; exit 1; }
      # 判据不能只有一次：CI 的 PATH 恒含 bun（上面的 setup-bun），只跑默认 PATH
      # 判的是两种判据里**弱的那一种**；而「用户机器上没有 bun」恰是编译产物存在的
      # 全部理由。RUN_PATH 只作用于**调用产物**那几次，编译步骤仍用环境 PATH。
      - name: Compiled-binary daemon smoke test
        run: bash scripts/smoke-daemon.sh apps/cli
      - name: Compiled-binary daemon smoke test (bun off PATH)
        run: RUN_PATH=/usr/bin:/bin bash scripts/smoke-daemon.sh apps/cli
      # 上面两条都走 happy path：脚本里那两个守卫分支（daemon 扛过 stop 时保留
      # $WORK、以及 start 报成功而 status 否认）在 CI 里一次都不会被执行。用例
      # 用 stub CLI 驱动**同一个脚本**（apps/cli/test/fixtures/），第一条是它的
      # 正对照 —— 否则「红」分不清是脚本坏了还是守卫永不通过。
      - name: Daemon smoke-test guard branches (negative cases)
        run: bash scripts/smoke-daemon-guards.sh

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mipham/web build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      # 除 cli / telemetry 外的包单独跑（当前 packages/shared 无测试文件，是空转；留在这里是
      # 为了将来它加了测试不会静默掉出 CI）。这两个包改用 --coverage 跑：覆盖率阈值门禁
      # 定义在各自 vitest.config.ts 的 coverage.thresholds，必须真的有执行路径去跑它，
      # 否则就是「有定义、无调用点」的空转守卫（cli 2026-09-15 接上，telemetry 同批）。
      # 它们从这一行排除，是为了不把同一套测试跑两遍；`test` 仍在下面逐包生效，
      # apps/web 与 packages/shared 只声明了 `test`，把它们从 CI 里换成 coverage 会让
      # 两个包静默掉出（--filter 会跳过没有该 script 的包）。
      - run: pnpm -r --filter '!@miphamai/cli' --filter '!@mipham/telemetry' test
      - run: pnpm --filter @miphamai/cli coverage
      # 测试总数的**真值门**（D16）。这个数没有进程内真源，只能由一次真套件跑得到，
      # 所以判据取**这次跑自己报出来的总数** —— 上面那条 coverage 脚本已经多挂了一个
      # JSON reporter，报告落在 `apps/cli/coverage/`（覆盖率目录，已在 .gitignore 里），
      # 不额外多跑一遍套件。落盘值（package-info 的 TEST_COUNT，两个官网的产品页直接读它）
      # ≠ 套件自报总数 ⇒ 红。
      # 这不是另一道守卫的重复：published-counts.test.ts 守的是落盘值与 CLAUDE.md
      # **一致**，守不了**对不对** —— 两边一起漂它照样全绿。
      - name: 测试总数真值门（落盘值 ≠ 套件自报总数即红）
        run: cd apps/cli && bun run scripts/sync-counts.ts --check --test-report coverage/vitest-report.json
      - run: pnpm --filter @mipham/telemetry coverage

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  penetration-test:
    name: Penetration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: cd apps/cli && pnpm test -- test/security/penetration/

  install-scripts:
    name: Validate install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Parse install.ps1 (PowerShell syntax)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "SYNTAX ERROR: $($_.Message)" }
            exit 1
          }
          Write-Host "install.ps1 syntax OK"
