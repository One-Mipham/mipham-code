# Mipham Code — 遥测接收端 vhost
#
# 落盘: /etc/nginx/sites-available/log.onemipham.com.conf
#      + ln -s 到 sites-enabled/（本机惯例是一域一文件，conf.d/ 为空）
# 证书: certbot certonly --webroot -w /var/www/acme -d log.onemipham.com
#      **不用 `certbot --nginx`** —— 它会改写本文件，而 deploy.sh --check 建在逐字 diff 上。
#
# 这个端点是**公开、只写、无读**的：不设鉴权（CLI 请求带不了自定义头，且本仓库
# Apache 2.0 发布到 npm ⇒ 硬编码 token 不是秘密）。防护面因此全在「能往里写什么」
# —— 由应用层的 allowlist 收敛，而不是由这里。

# 本组织的既有 vhost 一律用默认 combined 格式记日志，而 `$request` 含查询串。
# 查询串是**客户端可控的自由文本**，会被原样写进日志文件 ⇒ 一个可投毒的日志通道
# （塞换行符即可伪造日志行）。这里改记 `$uri`（已归一化、不含 `?args`），
# 代价是本 vhost 的日志格式与同机其他站不同 —— 有意为之。
log_format mipham_telemetry '$remote_addr [$time_local] '
                            '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                            '"$http_user_agent"';

# ---------------------------------------------------------------------------
# 80：只服务 ACME 挑战，其余一律 444
#
# **这里绝不能写 `return 301 https://...`**，尽管那是本组织的标准写法。
# 客户端（`apps/cli/src/telemetry/transport.ts`）的 `fetchWithRetry` 调用里
# **没有 `redirect` 键** ⇒ undici 默认 `redirect: 'follow'`，会透明跟随 301。
# 于是 `http://log.onemipham.com/v1/events` 的请求**已经以明文把事件体发到了这里**，
# 301 只是在事后补救 —— 集团 §二 要求传输层 TLS 1.3，明文第一跳即违规。
#
# `return 444` 在请求头阶段就关闭连接：不发响应、不发 Location、**不读请求体**。
# 明文客户端拿不到任何响应 ⇒ 传输失败 ⇒ 事件留在本地队列，符合「绝不静默丢失」。
# ACME location 用 `^~` 前缀匹配，优先级高于 `location /`，所以续期不受 444 影响。
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name log.onemipham.com;

    # 保留这一块（而不是签发后删掉）：将来无论用 webroot 还是换回 nginx 认证器都能续期。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 444;
    }

    access_log /var/log/nginx/log.onemipham.com.access.log mipham_telemetry;
    error_log /var/log/nginx/log.onemipham.com.error.log;
}

# ---------------------------------------------------------------------------
# 443：唯一真正服务的路径是 `location = /v1/events`，其余一律 404
# ---------------------------------------------------------------------------
server {
    # 主机 2 是 nginx 1.24.0，`http2` 作为 listen 参数在这里是**正确写法**。
    # nginx ≥ 1.25.1 会为此报一条 deprecation 警告（仍可用），届时改为
    # `listen 443 ssl;` + `http2 on;` 即可 —— 但**不能提前改**：`http2 on;`
    # 在 1.24 上是未知指令，`nginx -t` 会直接失败。升级 nginx 时记得这一行。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name log.onemipham.com;

    ssl_certificate /etc/letsencrypt/live/log.onemipham.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/log.onemipham.com/privkey.pem;

    # **刻意不写 `include /etc/letsencrypt/options-ssl-nginx.conf`。**
    # 本组织其余 vhost 都写它，所以这里必须说清为什么不能照抄：
    #
    # 那个文件里有 `ssl_protocols TLSv1.2 TLSv1.3;`，而集团 §二 要求 TLS 1.3。
    # 直觉做法是「在 include 之后写一行 `ssl_protocols TLSv1.3;` 覆盖掉它」——
    # **那是错的，而且错得看不出来**。nginx 对本指令是**并集**语义（不是取最后一次
    # 出现）：2026-09-15 本机实测，include + 后面覆盖的那一版**仍然协商成功了 TLS 1.2**
    # （`Protocol: TLSv1.2, Cipher: ECDHE-RSA-AES256-GCM-SHA384`）。
    # `nginx -t` 只报一句 `duplicate value "TLSv1.3"` 的警告，配置读起来完全正确，
    # 静态 grep 也只会看到我们那一行 —— 三道看起来像证明的东西全是假的。
    # 唯一能证伪的是一次真握手。
    #
    # 所以这里**自持 TLS 配置**，让全场只有一条 `ssl_protocols`，没有可并集的对象。
    ssl_protocols TLSv1.3;

    # TLS 1.3 的密码套件不可配置（nginx 1.24 无 `ssl_ciphersuites` 指令），
    # 故不写 ssl_ciphers / ssl_prefer_server_ciphers —— 它们只作用于 TLS 1.2，
    # 而 TLS 1.2 已关。TLS 1.3 的会话恢复在 nginx 里只走 ticket，ticket 关掉即无恢复，
    # 顺带让 `ssl_session_cache` / `ssl_session_timeout` 变成死配置 —— 一并省略，
    # 而不是抄过来摆着让人以为它们在生效。本端点的请求量是每客户端每天几十次。
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 64 KiB。客户端的 100 条队列里每条都是几百字节量级，余量充足。
    # 超限时 nginx 回 **413 且不读请求体** ⇒ 客户端按 4xx 丢弃（想要的：这种请求
    # 重发一百次也是同样的结果，留队只会堵住后面的真实事件）。
    client_max_body_size 64k;

    access_log /var/log/nginx/log.onemipham.com.access.log mipham_telemetry;
    error_log /var/log/nginx/log.onemipham.com.error.log;

    # 精确匹配。用前缀匹配的话 `/v1/events` 会被 nginx 用 301 补成 `/v1/events/`
    # —— 而 301 是 3xx，客户端跟随后 POST 会退化成 GET（303/301 语义），
    # 事件体白送一趟。精确匹配从根上杜绝这类重定向。
    location = /v1/events {
        proxy_pass http://127.0.0.1:9099;
        proxy_http_version 1.1;

        # **不开 upstream keepalive 池。** 本端点上有若干响应是不读请求体就发出的
        # （404 / 405 / 413 / 503），而 Node 一旦把响应写完就会销毁那种 socket。
        # 放了池子，下一次请求复用到的可能就是刚被对端关掉的连接 ⇒ 502。
        # 502 是 5xx，客户端按可重试处理，所以代价是延迟不是丢数据 —— 但纯属自找的噪声，
        # 而这个量级下「一请求一连接」的成本是零。
        # 显式写出（而不是依赖默认值），免得下一个维护者「顺手统一」成
        # `proxy_http_version 1.1` + `Connection ""` 那种为池子准备的写法。
        proxy_set_header Connection close;

        proxy_set_header Host $host;

        # **赋值，不是追加。** 本组织其余 4 份 vhost 全用 `$proxy_add_x_forwarded_for`，
        # 那是**追加**语义：客户端自带 `X-Forwarded-For: 1.2.3.4` 就会在最左端胜出。
        # 应用用 `X-Real-IP` 做限流桶键，但一旦有人把 `X-Real-IP $remote_addr`
        # 改成 `$proxy_add_x_forwarded_for`，追加语义会让**每个请求一个新桶** ——
        # 那等于没有限流，却看起来像有。这里用赋值把可信来源钉死。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        # > 客户端自己的 10s 超时。反过来的话，「服务端还在处理」会被客户端读成失败，
        # 于是它重试一条**已经成功**的事件（服务端去重能兜住，但白费一次往返）。
        proxy_read_timeout 15s;
    }

    # **无 3xx、无 fallback。** 任何其他路径（含错拼一个字母的 `/v1/event`）
    # 一律 404 ⇒ 客户端按 4xx 丢弃。这是刻意的：契约漂移的后果必须是
    # 「看得出来」（报告里一个事件都没有），而不是把事件发到某个还能收下的地方。
    location / {
        return 404;
    }

    # **方法路由由应用独家负责，这里刻意不写 `limit_except POST`、也不写 `if`。**
    # ① `limit_except POST { deny all; }` 给的是 **403 不是 405** —— 而应用实现的是
    #    405 且有 live 测试覆盖；两处都写会造出两个真源（测试钉 405、线上给 403）。
    # ② 要在 nginx 拿到 405 只能写 `if ($request_method != POST) { return 405; }`，
    #    而 location 里的 `if` 是 nginx 官方文档点名警告的构造。
    # 非 POST 请求被代理进应用后由它回 405，语义与测试一致。
}
